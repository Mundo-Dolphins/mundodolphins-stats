# Weather translations
weather:
  patterns:
    - pattern: "relative humidity"
      translation: "humedad relativa"
    - pattern: "gusts up to"
      translation: "rafagas de hasta"
    - pattern: "degrees?"
      translation: "grados"
    - pattern: "humidity"
      translation: "humedad"
    - pattern: "wind"
      translation: "viento"

# Scoring translations (complex patterns)
scoring_plays:
  # These are pattern replacements for complex scoring descriptions
  patterns:
    - pattern: '(\d+)\s+yards?\s+(?:rushing|run|rush)\b'
      replacement: "carrera de $1 yardas"
    - pattern: '(\d+)\s+yards?\s+field goal\b'
      replacement: "field goal de $1 yardas"
    - pattern: '(\d+)\s+yards?\s+pass from\s+(\S+)\b'
      replacement: "pase de $1 yardas de $2"
    - pattern: '(\d+)\s+yards?\b'
      replacement: "$1 yardas"
  
  # Simple exact replacements
  simple:
    "two point pase successful": "conversión de dos puntos"
    "two point pass successful": "conversión de dos puntos"
    "run failed": "conversión fallida"
    "pass failed": "conversión fallida"
    "tackled in end zone": "placado en la end zone"
    "kickoff return": "retorno de kickoff"
    "kick return": "retorno de patada"
    "interception return": "retorno de interception"
    "pass from": "pase de"
    "pass to": "pase a"
    "pass": "pase"
    "extra point": "punto extra"
    "rush": "carrera"
    "running": "carrera"
    "touchdown": "touchdown"
    "de 1 yardas": "de 1 yarda"

